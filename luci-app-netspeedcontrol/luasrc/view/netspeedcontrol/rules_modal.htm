<%
local nsc
local ok, m = pcall(require, "luci.model.cbi.netspeedcontrol.tools")
if ok then
	nsc = m
else
	nsc = require "luci.tools.netspeedcontrol"
end
local online_devices = nsc.load_online_devices()
%>

<style>
.nsc-modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center; }
.nsc-modal-dialog { background:#ffffff; border-radius:8px; width:540px; max-width:92%; padding:20px 24px; box-shadow:0 10px 25px rgba(0,0,0,0.2); position:relative; box-sizing:border-box; overflow:hidden; }
.nsc-modal-dialog * { box-sizing:border-box !important; }
.nsc-modal-title { font-size:16px; font-weight:bold; color:#2d3748; padding-bottom:12px; border-bottom:1px solid #e2e8f0; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
.nsc-modal-close { font-size:18px; cursor:pointer; color:#a0aec0; }
.nsc-modal-close:hover { color:#e53e3e; }
.nsc-form-group { margin-bottom:12px; width:100%; }
.nsc-form-row-2 { display:grid !important; grid-template-columns:repeat(2, minmax(0, 1fr)) !important; gap:12px !important; width:100% !important; margin-bottom:12px; }
.nsc-form-row-2 > div { min-width:0 !important; width:100% !important; }
.nsc-form-label { display:block; font-size:12px; font-weight:bold; color:#2d3748; margin-bottom:4px; }
.nsc-form-control { width:100% !important; max-width:100% !important; padding:7px 10px; border:1px solid #cbd5e0; border-radius:4px; font-size:13px; color:#1a202c; background:#ffffff; margin:0 !important; }
.nsc-form-control::placeholder { color:#718096 !important; opacity:1 !important; }
.nsc-weekday-group { display:flex !important; flex-wrap:wrap !important; gap:14px !important; align-items:center !important; margin-bottom:6px !important; background:#f7fafc !important; padding:10px 14px !important; border-radius:4px !important; border:1px solid #e2e8f0 !important; }
.nsc-weekday-item { display:inline-flex !important; align-items:center !important; justify-content:center !important; font-size:13px !important; color:#2d3748 !important; cursor:pointer !important; user-select:none !important; line-height:1 !important; height:22px !important; margin:0 !important; }
.nsc-weekday-item input[type="checkbox"] { appearance:auto !important; -webkit-appearance:checkbox !important; margin:0 6px 0 0 !important; padding:0 !important; width:15px !important; height:15px !important; cursor:pointer !important; vertical-align:middle !important; position:relative !important; top:0 !important; align-self:center !important; }
.nsc-btn-group { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:12px; border-top:1px solid #e2e8f0; }
.nsc-preset-btn { padding:4px 8px; font-size:11px; margin-right:6px; border-radius:4px; border:1px solid #cbd5e0; background:#f7fafc; cursor:pointer; color:#2d3748; }
.nsc-preset-btn:hover { background:#edf2f7; border-color:#cbd5e0; }

/* CBI 表格宽度与控制列优化 */
input[id$='._custom_mac'] { min-width: 170px !important; width: 170px !important; font-family: monospace; }
input[id$='.custom_domains'] { min-width: 180px !important; }
select:disabled, input:disabled { background-color: #edf2f7 !important; cursor: not-allowed !important; color: #a0aec0 !important; opacity: 0.6 !important; }
</style>

<!-- NSC Modal 模态弹窗 -->
<div id="nscModalOverlay" class="nsc-modal-overlay">
	<div class="nsc-modal-dialog">
		<input type="hidden" id="modal_sid" value="">
		<div class="nsc-modal-title">
			<span id="nscModalTitleText"><%:新增设备控制规则%></span>
			<span class="nsc-modal-close" onclick="closeAddRuleModal()">&times;</span>
		</div>
		
		<div class="nsc-form-group">
			<label class="nsc-form-label"><%:规则名称%></label>
			<input type="text" id="modal_rule_name" class="nsc-form-control" placeholder="如：KidPhone" value="KidPhone">
		</div>

		<div class="nsc-form-group">
			<label class="nsc-form-label"><%:受控设备%></label>
			<input type="text" id="modal_device_search" class="nsc-form-control" style="margin-bottom: 6px;" placeholder="🔍 输入设备名称、IP 或 MAC 模糊搜索..." oninput="filterModalDeviceOptions(this.value)">
			<select id="modal_rule_mac" class="nsc-form-control" onchange="toggleModalCustomMac(this)">
				<option value="">-- <%:请选择在线设备%> --</option>
				<% for _, dev in ipairs(online_devices) do %>
					<option value="<%=pcdata(dev.mac)%>"><%=pcdata(nsc.device_label(dev))%></option>
				<% end %>
				<option value="CUSTOM">+ <%:手动填写 MAC 地址...%></option>
			</select>
		</div>

		<div class="nsc-form-group" id="modal_custom_mac_group" style="display:none;">
			<label class="nsc-form-label"><%:手动 MAC 地址%></label>
			<input type="text" id="modal_custom_mac" class="nsc-form-control" placeholder="AA:BB:CC:DD:EE:FF">
		</div>

		<div class="nsc-form-row-2">
			<div>
				<label class="nsc-form-label"><%:控制方式%></label>
				<select id="modal_rule_mode" class="nsc-form-control" onchange="toggleModalLimitOptions(this)">
					<option value="block" selected><%:设定时间内断网%></option>
					<option value="limit"><%:设定时间内限速%></option>
				</select>
			</div>
			<div>
				<label class="nsc-form-label"><%:控制范围%></label>
				<select id="modal_rule_scope" class="nsc-form-control" onchange="toggleModalScopeOptions(this)">
					<option value="all" selected><%:全网流量 (所有访问)%></option>
					<option value="app"><%:指定应用分类%></option>
					<option value="custom_domain"><%:自定义域名%></option>
				</select>
			</div>
		</div>

		<!-- 限速配置项：当控制方式为“设定时间内限速”时展开 -->
		<div id="modal_limit_group" style="display:none;">
			<div class="nsc-form-row-2">
				<div>
					<label class="nsc-form-label"><%:上传限速 (如 256k 或 1M)%></label>
					<input type="text" id="modal_rule_up" class="nsc-form-control" placeholder="例如：256k 或 1M">
				</div>
				<div>
					<label class="nsc-form-label"><%:下载限速 (如 1024k 或 2M)%></label>
					<input type="text" id="modal_rule_down" class="nsc-form-control" placeholder="例如：1024k 或 2M">
				</div>
			</div>
		</div>

		<div class="nsc-form-group" id="modal_app_cat_group" style="display:none;">
			<label class="nsc-form-label"><%:应用分类%></label>
			<select id="modal_rule_app_cat" class="nsc-form-control">
				<option value="short_video"><%:短视频与直播 (抖音/快手/B站)%></option>
				<option value="gaming"><%:网络游戏 (腾讯/网易/米哈游/Steam)%></option>
				<option value="video"><%:影视视频 (爱奇艺/腾讯视频/优酷)%></option>
				<option value="social"><%:社交聊天 (微信/QQ/微博)%></option>
			</select>
		</div>

		<div class="nsc-form-group" id="modal_custom_domain_group" style="display:none;">
			<label class="nsc-form-label"><%:自定义域名%></label>
			<input type="text" id="modal_rule_domains" class="nsc-form-control" placeholder="例如：baidu.com tieba.baidu.com">
		</div>

		<div class="nsc-form-group">
			<label class="nsc-form-label"><%:生效星期 (默认全选)%></label>
			<div class="nsc-weekday-group">
				<label class="nsc-weekday-item"><input type="checkbox" class="nsc-modal-weekday" value="1" checked> <%:周一%></label>
				<label class="nsc-weekday-item"><input type="checkbox" class="nsc-modal-weekday" value="2" checked> <%:周二%></label>
				<label class="nsc-weekday-item"><input type="checkbox" class="nsc-modal-weekday" value="3" checked> <%:周三%></label>
				<label class="nsc-weekday-item"><input type="checkbox" class="nsc-modal-weekday" value="4" checked> <%:周四%></label>
				<label class="nsc-weekday-item"><input type="checkbox" class="nsc-modal-weekday" value="5" checked> <%:周五%></label>
				<label class="nsc-weekday-item"><input type="checkbox" class="nsc-modal-weekday" value="6" checked> <%:周六%></label>
				<label class="nsc-weekday-item"><input type="checkbox" class="nsc-modal-weekday" value="7" checked> <%:周日%></label>
			</div>
			<div>
				<button type="button" class="nsc-preset-btn" onclick="selectModalWeekdays('all')"><%:全选 (一至日)%></button>
				<button type="button" class="nsc-preset-btn" onclick="selectModalWeekdays('work')"><%:仅工作日 (一至五)%></button>
				<button type="button" class="nsc-preset-btn" onclick="selectModalWeekdays('weekend')"><%:仅周末 (六日)%></button>
			</div>
		</div>

		<div class="nsc-form-group">
			<label class="nsc-form-label"><%:快捷场景预设时间%></label>
			<div>
				<button type="button" class="nsc-preset-btn" onclick="applyModalTimePreset('night')"><%:夜间防沉迷 (22:00-06:00)%></button>
				<button type="button" class="nsc-preset-btn" onclick="applyModalTimePreset('study')"><%:学习工作 (08:00-17:00)%></button>
				<button type="button" class="nsc-preset-btn" onclick="applyModalTimePreset('allday')"><%:全天生效 (00:00-23:59)%></button>
			</div>
		</div>

		<div class="nsc-form-row-2">
			<div>
				<label class="nsc-form-label"><%:开始时间 (24小时制)%></label>
				<input type="text" id="modal_rule_start" class="nsc-form-control" value="21:00" placeholder="21:00">
			</div>
			<div>
				<label class="nsc-form-label"><%:结束时间 (跨天自动兼容)%></label>
				<input type="text" id="modal_rule_stop" class="nsc-form-control" value="07:00" placeholder="07:00">
			</div>
		</div>

		<div class="nsc-btn-group">
			<button type="button" class="cbi-button cbi-button-reset" onclick="closeAddRuleModal()"><%:取消%></button>
			<button type="button" class="cbi-button cbi-button-add" onclick="submitModalAddRule(false)"><%:确定添加 (暂存)%></button>
			<button type="button" class="cbi-button cbi-button-save" onclick="submitModalAddRule(true)"><%:确定并立即应用%></button>
		</div>
	</div>
</div>

<script type="text/javascript">
	function openModalInternal() {
		var overlay = document.getElementById("nscModalOverlay");
		if (overlay) overlay.style.display = "flex";
	}

	function filterModalDeviceOptions(query) {
		var select = document.getElementById("modal_rule_mac");
		if (!select) return;
		var options = select.options;
		var q = (query || "").trim().toLowerCase();
		var visibleCount = 0;
		var lastMatchIndex = -1;

		for (var i = 0; i < options.length; i++) {
			var opt = options[i];
			if (opt.value === "" || opt.value === "CUSTOM") {
				opt.style.display = "";
				continue;
			}
			var text = (opt.text || "").toLowerCase();
			var val = (opt.value || "").toLowerCase();

			if (q === "" || text.indexOf(q) !== -1 || val.indexOf(q) !== -1) {
				opt.style.display = "";
				visibleCount++;
				lastMatchIndex = i;
			} else {
				opt.style.display = "none";
			}
		}

		if (visibleCount === 1 && lastMatchIndex !== -1) {
			select.selectedIndex = lastMatchIndex;
			toggleModalCustomMac(select);
		}
	}

	function openAddRuleModal() {
		var searchInput = document.getElementById("modal_device_search");
		if (searchInput) {
			searchInput.value = "";
			filterModalDeviceOptions("");
		}
		document.getElementById("modal_sid").value = "";
		document.getElementById("nscModalTitleText").innerText = "<%:新增设备控制规则%>";
		
		document.getElementById("modal_rule_name").value = "KidPhone";
		document.getElementById("modal_rule_mac").value = "";
		document.getElementById("modal_custom_mac").value = "";
		document.getElementById("modal_rule_mode").value = "block";
		document.getElementById("modal_rule_scope").value = "all";
		document.getElementById("modal_rule_app_cat").value = "short_video";
		document.getElementById("modal_rule_domains").value = "";
		selectModalWeekdays('all');
		document.getElementById("modal_rule_start").value = "21:00";
		document.getElementById("modal_rule_stop").value = "07:00";
		document.getElementById("modal_rule_up").value = "";
		document.getElementById("modal_rule_down").value = "";

		toggleModalCustomMac(document.getElementById("modal_rule_mac"));
		toggleModalLimitOptions(document.getElementById("modal_rule_mode"));
		toggleModalScopeOptions(document.getElementById("modal_rule_scope"));

		openModalInternal();
	}

	function openEditRuleModal(btn) {
		if (!btn || !btn.dataset) return;
		var ds = btn.dataset;

		var searchInput = document.getElementById("modal_device_search");
		if (searchInput) {
			searchInput.value = "";
			filterModalDeviceOptions("");
		}

		document.getElementById("modal_sid").value = ds.sid || "";
		document.getElementById("nscModalTitleText").innerText = "<%:修改设备控制规则%>";

		document.getElementById("modal_rule_name").value = ds.name || "KidPhone";
		
		var macSel = document.getElementById("modal_rule_mac");
		var macVal = (ds.mac || "").toUpperCase();
		var foundMac = false;
		for (var i = 0; i < macSel.options.length; i++) {
			if (macSel.options[i].value.toUpperCase() === macVal) {
				macSel.selectedIndex = i;
				foundMac = true;
				break;
			}
		}
		if (!foundMac && macVal !== "") {
			macSel.value = "CUSTOM";
			document.getElementById("modal_custom_mac").value = macVal;
		} else {
			document.getElementById("modal_custom_mac").value = "";
		}

		document.getElementById("modal_rule_mode").value = ds.mode || "block";
		document.getElementById("modal_rule_scope").value = ds.scope || "all";
		document.getElementById("modal_rule_app_cat").value = ds.app || "short_video";
		document.getElementById("modal_rule_domains").value = ds.domains || "";
		
		var weekdaysStr = ds.weekdays || "1 2 3 4 5 6 7";
		var dayCbs = document.querySelectorAll(".nsc-modal-weekday");
		for (var d = 0; d < dayCbs.length; d++) {
			dayCbs[d].checked = (weekdaysStr.indexOf(dayCbs[d].value) !== -1);
		}

		document.getElementById("modal_rule_start").value = ds.start || "21:00";
		document.getElementById("modal_rule_stop").value = ds.stop || "07:00";
		document.getElementById("modal_rule_up").value = ds.up || "";
		document.getElementById("modal_rule_down").value = ds.down || "";

		toggleModalCustomMac(macSel);
		toggleModalLimitOptions(document.getElementById("modal_rule_mode"));
		toggleModalScopeOptions(document.getElementById("modal_rule_scope"));

		openModalInternal();
	}

	function closeAddRuleModal() {
		var overlay = document.getElementById("nscModalOverlay");
		if (overlay) overlay.style.display = "none";
	}

	function toggleModalCustomMac(sel) {
		var group = document.getElementById("modal_custom_mac_group");
		if (group) group.style.display = (sel.value === "CUSTOM") ? "block" : "none";
	}

	function toggleModalLimitOptions(sel) {
		var limitGroup = document.getElementById("modal_limit_group");
		if (limitGroup) limitGroup.style.display = (sel.value === "limit") ? "block" : "none";
	}

	function toggleModalScopeOptions(sel) {
		var appGroup = document.getElementById("modal_app_cat_group");
		var domainGroup = document.getElementById("modal_custom_domain_group");
		if (appGroup) appGroup.style.display = (sel.value === "app") ? "block" : "none";
		if (domainGroup) domainGroup.style.display = (sel.value === "custom_domain") ? "block" : "none";
	}

	function selectModalWeekdays(type) {
		var cbs = document.querySelectorAll(".nsc-modal-weekday");
		for (var i = 0; i < cbs.length; i++) {
			var val = parseInt(cbs[i].value, 10);
			if (type === 'all') {
				cbs[i].checked = true;
			} else if (type === 'work') {
				cbs[i].checked = (val >= 1 && val <= 5);
			} else if (type === 'weekend') {
				cbs[i].checked = (val === 6 || val === 7);
			}
		}
	}

	function applyModalTimePreset(type) {
		var startInput = document.getElementById("modal_rule_start");
		var stopInput = document.getElementById("modal_rule_stop");
		if (!startInput || !stopInput) return;
		if (type === 'night') { startInput.value = "22:00"; stopInput.value = "06:00"; }
		else if (type === 'study') { startInput.value = "08:00"; stopInput.value = "17:00"; }
		else if (type === 'allday') { startInput.value = "00:00"; stopInput.value = "23:59"; }
	}

	function submitModalAddRule(autoCommit) {
		var macSel = document.getElementById("modal_rule_mac").value;
		var customMac = document.getElementById("modal_custom_mac").value;
		var finalMac = (macSel === "CUSTOM" || !macSel) ? customMac : macSel;
		
		if (!finalMac) {
			alert("请选择一个在线设备或填写有效的 MAC 地址！");
			return;
		}

		var selectedDays = [];
		var dayCbs = document.querySelectorAll(".nsc-modal-weekday");
		for (var d = 0; d < dayCbs.length; d++) {
			if (dayCbs[d].checked) selectedDays.push(dayCbs[d].value);
		}
		var finalWeekdays = selectedDays.join(" ");

		var sidVal = document.getElementById("modal_sid").value || "";

		var data = {
			sid: sidVal,
			name: document.getElementById("modal_rule_name").value || "KidPhone",
			mac: finalMac,
			mode: document.getElementById("modal_rule_mode").value || "block",
			target_scope: document.getElementById("modal_rule_scope").value || "all",
			app_category: document.getElementById("modal_rule_app_cat").value || "short_video",
			custom_domains: document.getElementById("modal_rule_domains").value || "",
			weekdays: finalWeekdays || "1 2 3 4 5 6 7",
			start_time: document.getElementById("modal_rule_start").value || "21:00",
			stop_time: document.getElementById("modal_rule_stop").value || "07:00",
			up_kbit: document.getElementById("modal_rule_up").value || "",
			down_kbit: document.getElementById("modal_rule_down").value || "",
			commit: autoCommit ? "1" : "0"
		};

		var formData = new FormData();
		for (var k in data) {
			formData.append(k, data[k]);
		}

		var xhr = new XMLHttpRequest();
		xhr.open("POST", "<%=url('admin/network/netspeedcontrol/add_rule')%>", true);
		xhr.onload = function() {
			if (xhr.status === 200) {
				try {
					var res = JSON.parse(xhr.responseText);
					if (res.status === "ok") {
						closeAddRuleModal();
						window.location.reload();
					} else {
						alert(res.message || "提交规则失败！");
					}
				} catch(e) {
					alert("响应格式解析错误！");
				}
			} else {
				alert("网络请求失败，状态码: " + xhr.status);
			}
		};
		xhr.onerror = function() {
			alert("网络连接异常，提交规则失败！");
		};
		xhr.send(formData);
	}

	function updateTableScopeDependencies() {
		var scopeSelects = document.querySelectorAll("select[id$='.target_scope']");
		for (var s = 0; s < scopeSelects.length; s++) {
			var scopeSel = scopeSelects[s];
			var id = scopeSel.id;
			var prefix = id.replace(/\.target_scope$/, "");
			var val = scopeSel.value;

			var appSel = document.getElementById(prefix + ".app_category");
			var domainInput = document.getElementById(prefix + ".custom_domains");

			if (appSel) {
				if (val === "app") {
					appSel.disabled = false;
					if (appSel.value === "") appSel.value = "short_video";
				} else {
					appSel.value = "";
					appSel.disabled = true;
				}
			}

			if (domainInput) {
				if (val === "custom_domain") {
					domainInput.disabled = false;
					domainInput.placeholder = "例如: baidu.com";
				} else {
					domainInput.value = "";
					domainInput.disabled = true;
					domainInput.placeholder = "";
				}
			}
		}
	}

	window.addEventListener("DOMContentLoaded", function() {
		var bindCbiAddButton = function() {
			var btns = document.querySelectorAll("input[name^='cbi.cts.'], button[name^='cbi.cts.'], input.cbi-button-add, button.cbi-button-add");
			for (var i = 0; i < btns.length; i++) {
				var btn = btns[i];
				if (btn.name && btn.name.indexOf("cbi.cts.") !== -1) {
					btn.type = "button";
					btn.onclick = function(ev) {
						if (ev) {
							ev.preventDefault();
							ev.stopPropagation();
						}
						openAddRuleModal();
						return false;
					};
				}
			}
		};
		bindCbiAddButton();
		setTimeout(bindCbiAddButton, 300);

		updateTableScopeDependencies();
		document.addEventListener("change", function(e) {
			if (e.target && e.target.id && e.target.id.indexOf(".target_scope") !== -1) {
				updateTableScopeDependencies();
			}

			// 自动化代理表格中的【状态】开关无感极速切换
			if (e.target && e.target.name && e.target.name.indexOf(".enabled") !== -1 && e.target.type === "checkbox") {
				var inputName = e.target.name;
				var sid = "";
				var match = inputName.match(/netspeedcontrol\.([^.]+)\.enabled/);
				if (match && match[1]) {
					sid = match[1];
				} else {
					var parts = inputName.split(".");
					for (var i = 0; i < parts.length; i++) {
						if (i > 0 && parts[i-1] === "netspeedcontrol") {
							sid = parts[i];
							break;
						}
					}
				}
				if (sid) {
					var enabledVal = e.target.checked ? "1" : "0";
					var formData = new FormData();
					formData.append("sid", sid);
					formData.append("enabled", enabledVal);
					XHR.post('<%=url("admin/network/netspeedcontrol/toggle_rule")%>', formData, function(x, res) {
						// 状态秒级异步提交并重载防护链成功
					});
				}
			}
		});
	});
</script>
