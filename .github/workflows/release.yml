name: Build and Release OpenWrt Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPK Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Version Info
        id: version
        run: |
          VERSION=$(grep -E '^PKG_VERSION:=' luci-app-netspeedcontrol/Makefile | cut -d'=' -f2 | tr -d ' ')
          RELEASE=$(grep -E '^PKG_RELEASE:=' luci-app-netspeedcontrol/Makefile | cut -d'=' -f2 | tr -d ' ')
          PKG_NAME=$(grep -E '^PKG_NAME:=' luci-app-netspeedcontrol/Makefile | cut -d'=' -f2 | tr -d ' ')
          
          FULL_VERSION="${VERSION}-${RELEASE}"
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "IPK Package Name: ${PKG_NAME}_${FULL_VERSION}_all.ipk"

      - name: Grant Execute Permission
        run: chmod +x build-ipk.sh

      - name: Build IPK Package
        run: |
          ./build-ipk.sh

      - name: Calculate Checksums
        run: |
          cd dist
          sha256sum *.ipk > sha256sums
          cat sha256sums

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-netspeedcontrol-ipk
          path: |
            dist/*.ipk
            dist/sha256sums

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Version Info
        id: version
        run: |
          VERSION=$(grep -E '^PKG_VERSION:=' luci-app-netspeedcontrol/Makefile | cut -d'=' -f2 | tr -d ' ')
          RELEASE=$(grep -E '^PKG_RELEASE:=' luci-app-netspeedcontrol/Makefile | cut -d'=' -f2 | tr -d ' ')
          TAG_NAME="v${VERSION}-${RELEASE}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: luci-app-netspeedcontrol-ipk
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            dist/*.ipk
            dist/sha256sums
          name: Release ${{ steps.version.outputs.tag_name }}
          body: |
            ## 🚀 OpenWrt/ImmortalWrt 设备上网控制插件 (luci-app-netspeedcontrol)

            ### 📦 安装说明

            在 OpenWrt 终端（SSH）中运行以下一键命令自动安装：

            ```sh
            sh -c "$(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh)"
            ```

            或者手动下载 `.ipk` 上传至 `/tmp` 目录后执行：

            ```sh
            opkg update
            opkg install /tmp/luci-app-netspeedcontrol*.ipk
            ```

            如果网页菜单未即时显示，请尝试重启 LuCI 服务：

            ```sh
            /etc/init.d/uhttpd restart # 或 /etc/init.d/nginx restart
            ```

            ### 🔒 SHA256 校验和
            请参考随 release 发布的 `sha256sums` 文件校验安装包完整性。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

